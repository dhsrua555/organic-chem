<!DOCTYPE html>
<meta charset="utf-8">
<title>이름 엔진 전수 검사용 목록</title>
<pre id="out"></pre>
<script type="module">
import { build, SCAFFOLDS, GROUP_ORDER, molblock } from '../js/chem/mol.js';
import { nameMolecule } from '../js/chem/name.js';
/* ?scaf=propene&n=3000 : 작용기 2개까지는 모두, 3~4개는 n 개 무작위(고정 시드) */
const q = new URLSearchParams(location.search);
const scaf = q.get('scaf'), N = +(q.get('n') || 0);
const sites = SCAFFOLDS[scaf].sites.length;
let seed = 12345; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
const combos = [{}];
for (let a = 0; a < sites; a++) for (const g of GROUP_ORDER) {
  combos.push({ [a]: g });
  for (let b = a + 1; b < sites; b++) for (const h of GROUP_ORDER) combos.push({ [a]: g, [b]: h });
}
for (let t = 0; t < N; t++) {
  const k = rnd() < 0.6 ? 3 : 4;
  if (k > sites) continue;
  const idx = [...Array(sites).keys()].sort(() => rnd() - 0.5).slice(0, k);
  const s = {}; for (const i of idx) s[i] = GROUP_ORDER[Math.floor(rnd() * GROUP_ORDER.length)];
  combos.push(s);
}
const lines = [];
for (const subs of combos) {
  const m = build(scaf, subs);
  let name;
  try { name = nameMolecule(m).nameEn; } catch (e) { name = 'CRASH ' + e.message; }
  lines.push(JSON.stringify(subs) + '\t' + name + '\t' + molblock(m).replace(/\n/g, '|'));
}
document.getElementById('out').textContent = lines.join('\n');
window.__done = true;
</script>
