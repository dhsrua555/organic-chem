const t0 = performance.now();
for (const [smi, want, wantKo, wantOld] of CASES) {
  let res;
  try { const m = parseSmiles(smi); layout(m); res = nameMolecule(m); }
  catch (e) { out.push(`CRASH ${smi}: ${e.message}\n${(e.stack || '').split('\n').slice(0, 3).join('\n')}`); fail++; continue; }
  const ok = res.nameEn === want && (!wantKo || res.nameKo === wantKo) && (!wantOld || (res.alt1993 && res.alt1993.en === wantOld));
  if (ok) pass++; else fail++;
  out.push(`${ok ? 'ok  ' : 'FAIL'} ${smi.padEnd(34)} ${res.nameEn}${ok ? '' : '   ← want ' + want}  | ${res.nameKo}${wantKo && res.nameKo !== wantKo ? '   ← want ' + wantKo : ''}${res.alt1993 ? '   [옛: ' + res.alt1993.en + ']' : ''}`);
}
out.push(`\n${pass} passed, ${fail} failed (${Math.round(performance.now() - t0)} ms)`);
out.push(fail ? 'RESULT: FAIL' : 'RESULT: ALL OK');
document.getElementById('out').textContent = out.join('\n');
window.__done = true;
