for (const [scaf, subs, want, wantKo] of CASES) {
  let res;

  catch (e) { out.push(`CRASH ${scaf} ${JSON.stringify(subs)}: ${e.message}\n${e.stack}`); fail++; continue; }

  if (ok) pass++; else fail++;
  out.push(`${ok ? 'ok  ' : 'FAIL'} ${scaf.padEnd(8)} ${JSON.stringify(subs).padEnd(40)} ${res.nameEn}${ok ? '' : '   ← want ' + want}  | ${res.nameKo}${wantKo && res.nameKo !== wantKo ? '   ← want ' + wantKo : ''}${res.alt1993 ? '   [1993: ' + res.alt1993.en + ']' : ''}`);
}
out.push(`\n${pass} passed, ${fail} failed (${Math.round(performance.now() - t0)} ms)`);
